{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-xl-8"><div class="card p-4"><h2>Mentor Registration</h2>
<p class="small-muted">Create your mentor account for one specific academic semester and batch. The system automatically generates one unique Mentor Code. A second mentor cannot register for the same semester + batch.</p>
<form method="post" class="row g-3">
<div class="col-md-6"><label class="form-label">Mentor name *</label><input class="form-control" name="name" required></div>
<div class="col-md-6"><label class="form-label">Department</label><input class="form-control" name="department"></div>
<div class="col-md-6"><label class="form-label">Username *</label><input class="form-control" name="username" required></div>
<div class="col-md-6"><label class="form-label">Password * (8+ chars)</label><input class="form-control" type="password" name="password" required></div>
<div class="col-md-6"><label class="form-label">Academic Year *</label><input class="form-control" name="academic_year" placeholder="2026-27" required></div>
<div class="col-md-3"><label class="form-label">Semester *</label><select class="form-select" name="semester" required>{% for n in range(1,9) %}<option value="{{n}}">Semester {{n}}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">Batch *</label><input class="form-control" name="batch" placeholder="B1" required></div>
<div class="col-12"><button class="btn btn-success">Create mentor account</button> <a class="btn btn-secondary" href="{{url_for('login')}}">Back</a></div>
</form></div></div></div>{% endblock %}
