{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div><h2>Add Mentor Suggestion</h2><p class="small-muted">Batch: {{assignment.batch}} · Semester {{assignment.semester}}</p></div>
  <a class="btn btn-outline-secondary" href="{{url_for('mentor_reports')}}">Back to Reports</a>
</div>
<div class="card p-4">
<form method="post">
  <div class="mb-3">
    <label class="form-label">Student *</label>
    <select class="form-select" name="urn" required>
      <option value="" selected disabled>Select student</option>
      {% for s in students %}<option value="{{s.urn}}">{{s.urn}} · {{s.name}}{% if s.roll_no %} · Roll {{s.roll_no}}{% endif %}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Suggestion *</label>
    <textarea class="form-control" name="suggestion" rows="5" required placeholder="Enter mentor suggestion"></textarea>
  </div>
  <button class="btn btn-primary">Add Mentor Suggestion</button>
  <a class="btn btn-secondary" href="{{url_for('mentor_reports')}}">Cancel</a>
</form>
</div>
{% endblock %}
