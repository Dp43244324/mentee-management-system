{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-lg-6"><div class="card p-4"><h2>Initial Mentor Setup</h2><p class="small-muted">This page is accessible only from the server computer. After creating the mentor, close the page and do not expose this route publicly.</p><form method="post"><input class="form-control mb-2" name="name" placeholder="Mentor name" required><input class="form-control mb-2" name="username" placeholder="Username" required><input class="form-control mb-2" type="password" name="password" placeholder="Password (8+ chars)" required><input class="form-control mb-2" name="department" placeholder="Department"><input class="form-control mb-3" name="batch" placeholder="Batch or ALL"><button class="btn btn-primary">Create mentor</button></form></div></div></div>{% endblock %}
